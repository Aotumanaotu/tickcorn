services:
  corn-tick:
    build: .
    container_name: corn-tick
    ports:
      - "8800:8800"          # 控制面板；建议安全组仅放行自己的 IP
    volumes:
      - ./data:/app/data     # 原始行情/元数据库/网页端设置 都持久化在宿主机
    environment:
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:?请先在 .env 里设置 DASHBOARD_TOKEN}
      - TZ=Asia/Shanghai
    restart: unless-stopped
