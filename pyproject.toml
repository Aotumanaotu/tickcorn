[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "corn-tick-microstructure"
version = "0.3.0"
description = "Futures microstructure research terminal: CTP market gateway, bid-ask bounce / true-move analytics, research reports (restructured: core / gateway / api / ws / auth)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "pyarrow>=10.0",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "PyYAML>=6.0",
    "tabulate>=0.9",
    # --- web stack (new architecture) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "msgpack>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
accel = ["polars>=0.19"]
model = ["scikit-learn>=1.1", "lightgbm>=3.3", "plotly>=5.10"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = [
    "legacy/dashboard/static/*.html",
    "gateway/native/*.cpp",
    "gateway/native/*.so",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# ROS environments expose these unrelated plugins through PYTHONPATH.
# Block them before auto-discovery imports their optional ROS dependencies.
addopts = "-q -p no:launch_testing -p no:launch_ros"

[tool.ruff]
line-length = 100
